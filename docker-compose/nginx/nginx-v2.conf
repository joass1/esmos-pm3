# V2 Config — WAF + gzip + rate limiting
# IMPORTANT: When switching to V2, change the nginx image in docker-compose.yml
# from nginx:1.27-alpine to owasp/modsecurity-crs:nginx-alpine
# and update the volume mount to point to this file instead of nginx-v1.conf

# ModSecurity WAF is built into the owasp/modsecurity-crs image.
# OWASP Core Rule Set (CRS) is enabled by default in that image.
# The settings below configure ModSecurity via its environment:
#   MODSEC_RULE_ENGINE=On
#   MODSEC_AUDIT_LOG=/var/log/modsecurity/audit.log

events { worker_connections 1024; }

http {
    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- Rate Limiting ---
    # 5 requests/sec per client IP, burst up to 10 with delay
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=5r/s;
    limit_req_status 429;

    upstream odoo_backend { server odoo:8069; }
    upstream moodle_backend { server moodle:80; }

    server {
        listen 80;

        # Apply rate limiting globally
        limit_req zone=global_limit burst=10 delay=5;

        # --- Security Headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- ModSecurity WAF ---
        # Enabled via the owasp/modsecurity-crs image.
        # OWASP CRS rules block common attacks:
        #   - SQL injection
        #   - Cross-site scripting (XSS)
        #   - Path traversal (../)
        #   - Local file inclusion (/etc/passwd)
        #   - Remote code execution
        modsecurity on;
        modsecurity_rules_file /etc/modsecurity.d/include.conf;

        location / {
            proxy_pass http://odoo_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 720s;
            client_max_body_size 50m;
        }

        location /moodle/ {
            proxy_pass http://moodle_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50m;
        }
    }
}
